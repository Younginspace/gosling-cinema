<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gosling Cinema</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="no-scroll">
  <!-- CRT Boot Screen (HTML overlay — plays during model load) -->
  <div id="boot-screen">
    <div class="crt-overlay"></div>
    <div class="boot-content">
      <div class="boot-logo">GOSLING<span class="blink">_</span></div>
      <div class="boot-sub">Gosling Cinema System, Version 1.0</div>
      <div class="boot-sub">Copyright (c) Gosling Filmography 2026. All Rights Reserved.</div>
      <br>
      <div class="boot-text" id="boot-text"></div>
      <br>
      <div class="boot-progress-wrap">
        <div class="boot-progress-bar" id="boot-progress"></div>
      </div>
      <div class="boot-status" id="boot-status">Initializing...</div>
    </div>
  </div>

  <!-- Three.js Canvas (fixed background) -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Hero overlay (shown after camera reveal, fades on scroll) -->
  <div id="hero-overlay" class="initially-hidden">
    <div class="hero-text">
      <h1 class="hero-title">A Ryan Gosling<br><em>Filmography</em></h1>
      <p class="hero-sub">Scroll to Explore His Universe</p>
    </div>
    <div class="scroll-indicator">
      <div class="scroll-line"></div>
    </div>
  </div>

  <!-- Film info overlay (top) -->
  <div id="film-info" class="initially-hidden">
    <h1 id="film-info-title"></h1>
    <p id="film-info-meta"></p>
  </div>

  <!-- 3D Film Strip Carousel -->
  <div id="carousel-viewport" class="initially-hidden">
    <div id="carousel-cylinder">
      <!-- frames injected by JS -->
    </div>
  </div>

  <!-- Navigation -->
  <button id="nav-prev" class="nav-btn initially-hidden" aria-label="Previous">&larr;</button>
  <button id="nav-next" class="nav-btn initially-hidden" aria-label="Next">&rarr;</button>

  <!-- Dot indicators -->
  <div id="dot-indicators" class="initially-hidden"></div>

  <!-- Mute/Unmute toggle -->
  <button id="mute-btn" class="initially-hidden" aria-label="Toggle sound">
    <svg id="icon-muted" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
    </svg>
    <svg id="icon-unmuted" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
    </svg>
  </button>

  <!-- Credits line -->
  <div id="credits-line" class="initially-hidden">
    Built with Three.js + GSAP &middot; A Ryan Gosling Story
  </div>

  <!-- Scroll spacer (provides scrollable height — all visible content is fixed) -->
  <div id="scroll-spacer"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
